[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-analyzer"
version = "2.0.0"
description = "Lightweight solid-liquid interface extraction and CFM analysis for MD trajectories"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "ovito>=3.9",
  "scipy>=1.8",
  "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
interface-analyzer-extract = "interface_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
